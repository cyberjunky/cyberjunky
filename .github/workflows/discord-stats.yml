name: Discord stats

# Updates the LIVE STATS channel names in The Junkyard Discord.
# Needs two repository secrets: DISCORD_BOT_TOKEN and DISCORD_GUILD_ID.

on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch:        # "Run workflow" button on the Actions tab

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/discord_stats.py
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          GITHUB_TOKEN: ${{ github.token }}
